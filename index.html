<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find the Promos</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Kuku assignment / Problem 1</p>
    <h1>Find the Promos</h1>
    <p class="intro">Rank 20–60 second promo candidates from timestamped microdrama scripts.</p>
    <section class="panel" aria-label="Analyze screenplays">
      <label for="files">Select screenplay files</label>
      <input id="files" type="file" accept=".txt,text/plain" multiple>
      <p class="hint">Select files named like <code>episode-001-example.txt</code>. The analysis runs on this device.</p>
      <div class="actions">
        <button id="analyze" type="button" disabled>Rank promos</button>
        <button id="sample" type="button" class="secondary">Try a fictional sample</button>
      </div>
      <p id="status" role="status"></p>
    </section>
    <section id="results" aria-labelledby="result-heading" hidden>
      <div class="result-bar">
        <h2 id="result-heading">Ranked candidates</h2>
        <button id="download" type="button" class="secondary">Download raw JSON</button>
      </div>
      <p id="summary"></p>
      <div id="list"></div>
    </section>
  </main>
</body>
</html>
